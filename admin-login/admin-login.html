<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veyzo Store - Login</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0B132B] min-h-screen flex items-center justify-center p-4 text-white font-sans antialiased">

  <div class="w-full max-w-md bg-[#131C31] rounded-2xl p-6 md:p-8 shadow-2xl border border-slate-800">
    
    <!-- Title / Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#2A364F] mb-4 text-[#E5B834] shadow-inner">
        <i data-lucide="store" class="w-7 h-7"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">
        Welcome to <span class="text-[#E5B834]">veyzo store</span>
      </h1>
      <p class="text-slate-400 text-sm mt-1">Fadlan geli xogtaada si aad u gasho</p>
    </div>

    <!-- Form -->
    <form class="space-y-4" onsubmit="handleLogin(event)">
      
      <!-- Email Field -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-slate-300 ml-1">Email</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="mail" class="w-5 h-5"></i>
          </div>
          <input 
            type="email" 
            id="login-email"
            required
            placeholder="Email-kaaga" 
            class="w-full bg-[#2A364F] text-slate-100 placeholder-[#8C9BAE] text-sm rounded-xl pl-11 pr-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-[#E5B834] transition-all border border-transparent"
          >
        </div>
      </div>

      <!-- Password Field -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-slate-300 ml-1">Furo Sireed</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="lock" class="w-5 h-5"></i>
          </div>
          <input 
            type="password" 
            id="login-password"
            required
            placeholder="Furo sireed (Password)" 
            class="w-full bg-[#2A364F] text-slate-100 placeholder-[#8C9BAE] text-sm rounded-xl pl-11 pr-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-[#E5B834] transition-all border border-transparent"
          >
        </div>
      </div>

      <!-- Notification Message Box (Hidden by default) -->
      <div id="statusMessage" class="hidden p-3 rounded-xl text-xs text-center transition-all"></div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="submit-btn"
        class="w-full bg-[#E5B834] hover:bg-[#d4a72d] text-slate-900 font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-all transform active:scale-[0.99] shadow-lg shadow-[#E5B834]/10 mt-6"
      >
        <i data-lucide="send" class="w-4 h-4"></i>
        <span>Gudbi</span>
      </button>

    </form>
  </div>

  <!-- Supabase Library-ga Rasmiga Ah -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- File-kaaga Konfiga oo Xiriirinaya Supabase -->
  <script src="supabase-config.js"></script>

  <script>
    lucide.createIcons();

    function getSupabase() {
      if (window.supabaseClient && typeof window.supabaseClient.auth === 'object') {
        return window.supabaseClient;
      }
      if (window.supabase && typeof window.supabase.auth === 'object') {
        return window.supabase;
      }
      return null;
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const msgBox = document.getElementById('statusMessage');
      const submitBtn = document.getElementById('submit-btn');

      msgBox.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'bg-emerald-500/10', 'text-emerald-400', 'border');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Fadlan sug...';

      try {
        const db = getSupabase();
        
        if (db && db.auth) {
          const { data, error } = await db.auth.signInWithPassword({
            email: email,
            password: password
          });

          if (error) throw error;
        }

        // Save login status to localStorage for Veyzo Store navigation
        localStorage.setItem('veyzo_logged_in', 'true');
        localStorage.setItem('veyzo_user_profile', JSON.stringify({ email: email }));

        msgBox.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
        msgBox.innerText = '✅ Waad ku guuleysatay inaad gasho! Waa lagu celinayaa bogga...';

        setTimeout(() => {
          window.location.href = "../index.html";
        }, 1500);

      } catch (err) {
        msgBox.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/20');
        msgBox.innerText = '❌ Cillad: ' + (err.message || 'Email-ka ama furaha sireedka waa khalad.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i data-lucide="send" class="w-4 h-4"><span>Gudbi</span>';
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
